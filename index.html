<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KojaJob</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #222;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      background: #111827;
      color: white;
      padding: 35px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 16px;
    }

    .content {
      padding: 25px 20px;
    }

    .search {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      color: #666;
      margin-bottom: 12px;
    }

    .button {
      display: inline-block;
      background: #111827;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>KojaJob</h1>
      <p>Trouvez un professionnel près de chez vous</p>
    </header>

    <div class="content">

      <input
        class="search"
        type="text"
        placeholder="Que recherchez-vous ?"
      >

      <div class="title">Professionnels disponibles</div>

      <div class="card">
        <h3>Coiffeur / Barbier</h3>
        <p>Coupe homme • Dégradé • Coiffure</p>
        <button class="button">Voir le professionnel</button>
      </div>

      <div class="card">
        <h3>Électricien</h3>
        <p>Installation • Réparation • Dépannage</p>
        <button class="button">Voir le professionnel</button>
      </div>

      <div class="card">
        <h3>Plombier</h3>
        <p>Réparation • Installation • Dépannage</p>
        <button class="button">Voir le professionnel</button>
      </div>

    </div>

    <footer>
      © 2026 KojaJob
    </footer>

  </div>

</body>
</html>
