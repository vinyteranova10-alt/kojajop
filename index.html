<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KojaJob</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fa;
    }

    .app {
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      background: white;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    header p {
      margin: 0;
    }

    .content {
      padding: 20px;
    }

    .search {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: #666;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .call {
      background: #111827;
      color: white;
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    .message {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    .error {
      color: #b91c1c;
      background: #fee2e2;
      border-radius: 10px;
      padding: 15px;
    }

    .info {
      color: #1d4ed8;
      background: #dbeafe;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      font-size: 14px;
      word-break: break-word;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>KojaJob</h1>
    <p>Trouvez un professionnel près de chez vous</p>
  </header>

  <div class="content">

    <input
      id="search"
      class="search"
      type="text"
      placeholder="Que recherchez-vous ?"
    >

    <div class="title">
      Professionnels disponibles
    </div>

    <div id="diagnostic"></div>

    <div id="professionals">
      <div class="message">
        Connexion à Firebase...
      </div>
    </div>

  </div>

  <footer>
    © 2026 KojaJob
  </footer>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


  /* =========================
     CONFIGURATION FIREBASE
  ========================= */

  const firebaseConfig = {

    apiKey: "AIzaSyBjIN5du2p3RoQ8Q_X26Zex1JRRMZdhEPA",

    authDomain: "kojajop.firebaseapp.com",

    projectId: "kojajop",

    storageBucket: "kojajop.firebasestorage.app",

    messagingSenderId: "982386680439",

    appId: "1:982386680439:web:ad3098eefc9a7c8d3b9c72",

    measurementId: "G-PPQRGYQMG9"

  };


  /* =========================
     INITIALISATION
  ========================= */

  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  const zone =
    document.getElementById("professionals");

  const diagnostic =
    document.getElementById("diagnostic");


  /* =========================
     DIAGNOSTIC
  ========================= */

  diagnostic.innerHTML = `

    <div class="info">

      <strong>Connexion KojaJob</strong><br><br>

      Projet Firebase : ${firebaseConfig.projectId}<br>

      Base : (default)<br>

      Collection : Professionnels<br>

      Document : h3rHA6yAsnmmUnwAvMm7

    </div>

  `;


  /* =========================
     TEST DE JEAN
  ========================= */

  async function testerJean() {

    try {

      zone.innerHTML =
        "<div class='message'>" +
        "Recherche de Jean dans Firebase..." +
        "</div>";


      const jeanReference = doc(
        db,
        "Professionnels",
        "h3rHA6yAsnmmUnwAvMm7"
      );


      const jeanDocument =
        await getDoc(jeanReference);


      if (jeanDocument.exists()) {

        const jean =
          jeanDocument.data();


        zone.innerHTML = `

          <div class="card">

            <h3>
              ${jean.nom || "Jean"}
            </h3>

            <p>
              🔧 ${jean.Metier || "Métier non renseigné"}
            </p>

            <p>
              📍 ${jean.Ville || "Ville non renseignée"}
            </p>

            <p>
              📞 ${jean["Téléphone"] || "Téléphone non renseigné"}
            </p>

            <div class="buttons">

              <a
                class="button call"
                href="tel:+237${jean["Téléphone"] || ""}">
                📞 Appeler
              </a>

              <a
                class="button whatsapp"
                href="https://wa.me/237${jean["Téléphone"] || ""}"
                target="_blank">
                WhatsApp
              </a>

            </div>

          </div>

        `;

        return;
      }


      zone.innerHTML = `

        <div class="message error">

          <strong>Firebase répond, mais le document est introuvable.</strong>

          <br><br>

          Chemin recherché :

          <br><br>

          <strong>
            Professionnels /
            h3rHA6yAsnmmUnwAvMm7
          </strong>

          <br><br>

          Projet utilisé :

          <strong>kojajop</strong>

        </div>

      `;


    } catch (erreur) {

      console.error(erreur);


      zone.innerHTML = `

        <div class="message error">

          <strong>Erreur de connexion Firebase</strong>

          <br><br>

          ${erreur.message}

        </div>

      `;

    }

  }


  testerJean();

</script>

</body>
</html>
