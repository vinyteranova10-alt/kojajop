<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KojaJob</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }
    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
    }
    header p {
      margin: 8px 0 0;
      opacity: 0.85;
    }
    .container {
      width: 92%;
      max-width: 900px;
      margin: 25px auto;
    }
    .search {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }
    #message {
      text-align: center;
      padding: 20px;
      font-size: 17px;
    }
    .professionnel {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }
    .professionnel h2 {
      margin: 0 0 10px;
      font-size: 21px;
    }
    .professionnel p {
      margin: 7px 0;
    }
    .telephone {
      display: inline-block;
      margin-top: 12px;
      padding: 11px 16px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
    .telephone:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
<header>
  <h1>KojaJob</h1>
  <p>Trouvez facilement un professionnel près de vous</p>
</header>
<div class="container">
  <input
    type="text"
    id="search"
    class="search"
    placeholder="Rechercher un métier ou une ville..."
  >
  <div id="message">
    Chargement des professionnels...
  </div>
  <div id="professionnels"></div>
</div>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBjIN5du2p3RoQ8Q_X26Zex1JRRMZdhEPA",
    authDomain: "kojajop.firebaseapp.com",
    projectId: "kojajop",
    storageBucket: "kojajop.firebasestorage.app",
    messagingSenderId: "982386680439",
    appId: "1:982386680439:web:ad3098eefc9a7c8d3b9c72",
    measurementId: "G-PPQRGYQMG9"
  };
  // Initialisation Firebase
  firebase.initializeApp(firebaseConfig);
  // Connexion à Firestore
  const db = firebase.firestore();
  const liste = document.getElementById("professionnels");
  const message = document.getElementById("message");
  const search = document.getElementById("search");
  let tousLesProfessionnels = [];
  // Charger les professionnels
  db.collection("Professionnels")
    .get()
    .then((snapshot) => {
      tousLesProfessionnels = [];
      snapshot.forEach((doc) => {
        const data = doc.data();
        tousLesProfessionnels.push({
          id: doc.id,
          ...data
        });
      });
      console.log("Professionnels trouvés :", tousLesProfessionnels);
      if (tousLesProfessionnels.length === 0) {
        message.textContent = "Aucun professionnel trouvé.";
        return;
      }
      message.textContent = "";
      afficherProfessionnels(tousLesProfessionnels);
    })
    .catch((error) => {
      console.error("Erreur Firebase :", error);
      message.textContent =
        "Impossible de charger les professionnels.";
    });
  // Affichage
  function afficherProfessionnels(professionnels) {
    liste.innerHTML = "";
    if (professionnels.length === 0) {
      message.textContent = "Aucun professionnel trouvé.";
      return;
    }
    message.textContent = "";
    professionnels.forEach((professionnel) => {
      const nom = professionnel.nom || "Nom non renseigné";
      const metier = professionnel.Metier || professionnel.metier || "Métier non renseigné";
      const ville = professionnel.Ville || professionnel.ville || "Ville non renseignée";
      const telephone =
        professionnel.Téléphone ||
        professionnel.Telephone ||
        professionnel.telephone ||
        "";
      const carte = document.createElement("div");
      carte.className = "professionnel";
      carte.innerHTML = `
        <h2>${nom}</h2>
        <p>
          <strong>Métier :</strong>
          ${metier}
        </p>
        <p>
          <strong>Ville :</strong>
          ${ville}
        </p>
        ${
          telephone
          ? `
            <a
              class="telephone"
              href="tel:${telephone}"
            >
              📞 Appeler
            </a>
          `
          : ""
        }
      `;
      liste.appendChild(carte);
    });
  }
  // Recherche
  search.addEventListener("input", function () {
    const texte = search.value.toLowerCase().trim();
    const resultats = tousLesProfessionnels.filter((professionnel) => {
      const nom =
        String(professionnel.nom || "").toLowerCase();
      const metier =
        String(
          professionnel.Metier ||
          professionnel.metier ||
          ""
        ).toLowerCase();
      const ville =
        String(
          professionnel.Ville ||
          professionnel.ville ||
          ""
        ).toLowerCase();
      return (
        nom.includes(texte) ||
        metier.includes(texte) ||
        ville.includes(texte)
      );
    });
    afficherProfessionnels(resultats);
  });
</script>
</body>
</html>
