<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KojaJob - Trouvez un professionnel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #222;
    }

    .app {
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      background: white;
    }

    header {
      background: #111827;
      color: white;
      padding: 35px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 16px;
    }

    .content {
      padding: 20px;
    }

    .search {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .professional-button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      background: #111827;
      color: white;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      margin-bottom: 7px;
      color: #666;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .call {
      background: #111827;
      color: white;
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    .no-result {
      text-align: center;
      padding: 20px;
      color: #777;
      display: none;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>KojaJob</h1>
    <p>Trouvez un professionnel près de chez vous</p>
  </header>

  <div class="content">

    <a
      href="#"
      class="professional-button"
      onclick="alert('La création de profil professionnel sera disponible très bientôt.'); return false;">
      👤 Je suis un professionnel
    </a>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="Que recherchez-vous ?"
    >

    <div class="title">Professionnels disponibles</div>

    <div id="professionals">
      <div class="loading">Chargement des professionnels...</div>
    </div>

    <div id="noResult" class="no-result">
      Aucun professionnel trouvé.
    </div>

  </div>

  <footer>
    © 2026 KojaJob
  </footer>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBjIN5du2p3RoQ8Q_X26Zex1JRRMZdhEPA",
    authDomain: "kojajop.firebaseapp.com",
    projectId: "kojajop",
    storageBucket: "kojajop.firebasestorage.app",
    messagingSenderId: "982386680439",
    appId: "1:982386680439:web:5fd9da8d9ee1d4243b9c72",
    measurementId: "G-E2NZDGMD4L"
  };

  firebase.initializeApp(firebaseConfig);

  const db = firebase.firestore();

  const professionalsContainer =
    document.getElementById("professionals");

  const search = document.getElementById("search");

  const noResult =
    document.getElementById("noResult");

  let professionals = [];

  function afficherProfessionnels(liste) {

    professionalsContainer.innerHTML = "";

    if (liste.length === 0) {
      noResult.style.display = "block";
      return;
    }

    noResult.style.display = "none";

    liste.forEach(function(pro) {

      const nom = pro.nom || "Professionnel";
      const metier = pro.Metier || pro.metier || "";
      const ville = pro.Ville || pro.ville || "";
      const telephone = pro.Téléphone || pro.telephone || "";

      const phone = telephone.toString().replace(/\s/g, "");

      const card = document.createElement("div");
      card.className = "card professional";

      card.innerHTML = `
        <h3>${nom} - ${metier}</h3>
        <p>🔧 ${metier}</p>
        <p>📍 ${ville}</p>

        <div class="buttons">
          <a
            class="button call"
            href="tel:+237${phone}">
            Appeler
          </a>

          <a
            class="button whatsapp"
            href="https://wa.me/237${phone}"
            target="_blank">
            WhatsApp
          </a>
        </div>
      `;

      professionalsContainer.appendChild(card);
    }
  }db.collection("Professionnels")
  .get()
  .then(function(snapshot) {

    console.log("Nombre de professionnels :", snapshot.size);

    professionals = [];

    snapshot.forEach(function(doc) {
      console.log("Document trouvé :", doc.id, doc.data());
      professionals.push(doc.data());
    });

    afficherProfessionnels(professionals);

  })
  .catch(function(error) {

    console.error("ERREUR FIREBASE :", error);

    professionalsContainer.innerHTML =
      "<p>Erreur Firebase : " + error.message + "</p>";

    noResult.style.display = "none";
  });

  

    const valeur = search.value
      .toLowerCase()
      .trim();

    const resultats = professionals.filter(function(pro) {

      const texte = `
        ${pro.nom || ""}
        ${pro.Metier || ""}
        ${pro.metier || ""}
        ${pro.Ville || ""}
        ${pro.ville || ""}
      `.toLowerCase();

      return texte.includes(valeur);
    });

    afficherProfessionnels(resultats);
  });
</script>

</body>
</html>
