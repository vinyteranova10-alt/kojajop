<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KojaJob</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }
    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
    }
    header p {
      margin: 8px 0 0;
      opacity: 0.85;
    }
    .container {
      width: 92%;
      max-width: 900px;
      margin: 25px auto;
    }
    .search {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }
    #message {
      text-align: center;
      padding: 20px;
      font-size: 17px;
    }
    .professionnel {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }
    .professionnel h2 {
      margin: 0 0 10px;
      font-size: 21px;
    }
    .professionnel p {
      margin: 7px 0;
    }
    .telephone {
      display: inline-block;
      margin-top: 12px;
      padding: 11px 16px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
    .erreur {
      color: #b91c1c;
      background: #fee2e2;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      text-align: left;
      word-break: break-word;
    }
  </style>
</head>
<body>
<header>
  <h1>KojaJob</h1>
  <p>Trouvez facilement un professionnel près de vous</p>
</header>
<div class="container">
  <input
    type="text"
    id="search"
    class="search"
    placeholder="Rechercher un métier ou une ville..."
  >
  <div id="message">
    Chargement des professionnels...
  </div>
  <div id="professionnels"></div>
</div>
<script>
  const FIREBASE_API_KEY =
    "AIzaSyBjIN5du2p3RoQ8Q_X26Zex1JRRMZdhEPA";
  const PROJECT_ID = "kojajop";
  const COLLECTION = "Professionnels";
  const message = document.getElementById("message");
  const liste = document.getElementById("professionnels");
  const search = document.getElementById("search");
  let tousLesProfessionnels = [];
  // --------------------------------------------------
  // LECTURE DE FIRESTORE
  // --------------------------------------------------
  async function chargerProfessionnels() {
    message.textContent = "Connexion à Firebase...";
    const url =
      "https://firestore.googleapis.com/v1/projects/" +
      PROJECT_ID +
      "/databases/(default)/documents/" +
      COLLECTION +
      "?key=" +
      encodeURIComponent(FIREBASE_API_KEY);
    try {
      const response = await fetch(url);
      const resultat = await response.json();
      console.log("Réponse Firebase :", resultat);
      if (!response.ok) {
        throw new Error(
          resultat.error && resultat.error.message
            ? resultat.error.message
            : "Erreur lors de la connexion à Firebase."
        );
      }
      const documents = resultat.documents || [];
      tousLesProfessionnels = documents.map((document) => {
        const fields = document.fields || {};
        return {
          id: document.name,
          nom: lireChamp(fields.nom),
          Metier: lireChamp(fields.Metier),
          Ville: lireChamp(fields.Ville),
          Téléphone: lireChamp(fields.Téléphone)
        };
      });
      console.log(
        "Nombre de professionnels trouvés :",
        tousLesProfessionnels.length
      );
      if (tousLesProfessionnels.length === 0) {
        message.innerHTML =
          "Firebase est connecté, mais aucun document n'a été retourné.";
        return;
      }
      message.textContent = "";
      afficherProfessionnels(tousLesProfessionnels);
    }
    catch (error) {
      console.error("Erreur Firebase :", error);
      message.innerHTML =
        '<div class="erreur">' +
        "<strong>Erreur de connexion Firebase :</strong><br><br>" +
        escapeHtml(error.message) +
        "</div>";
    }
  }
  // --------------------------------------------------
  // LIRE UNE VALEUR FIRESTORE
  // --------------------------------------------------
  function lireChamp(champ) {
    if (!champ) {
      return "";
    }
    if (champ.stringValue !== undefined) {
      return champ.stringValue;
    }
    if (champ.integerValue !== undefined) {
      return champ.integerValue;
    }
    if (champ.doubleValue !== undefined) {
      return champ.doubleValue;
    }
    if (champ.booleanValue !== undefined) {
      return champ.booleanValue;
    }
    return "";
  }
  // --------------------------------------------------
  // AFFICHER LES PROFESSIONNELS
  // --------------------------------------------------
  function afficherProfessionnels(professionnels) {
    liste.innerHTML = "";
    if (professionnels.length === 0) {
      message.textContent =
        "Aucun professionnel trouvé.";
      return;
    }
    message.textContent = "";
    professionnels.forEach((professionnel) => {
      const nom =
        professionnel.nom ||
        "Nom non renseigné";
      const metier =
        professionnel.Metier ||
        "Métier non renseigné";
      const ville =
        professionnel.Ville ||
        "Ville non renseignée";
      const telephone =
        professionnel.Téléphone ||
        "";
      const carte =
        document.createElement("div");
      carte.className =
        "professionnel";
      let boutonTelephone = "";
      if (telephone) {
        boutonTelephone =
          '<a class="telephone" href="tel:' +
          escapeHtml(telephone) +
          '">' +
          "📞 Appeler" +
          "</a>";
      }
      carte.innerHTML =
        "<h2>" +
        escapeHtml(nom) +
        "</h2>" +
        "<p><strong>Métier :</strong> " +
        escapeHtml(metier) +
        "</p>" +
        "<p><strong>Ville :</strong> " +
        escapeHtml(ville) +
        "</p>" +
        boutonTelephone;
      liste.appendChild(carte);
    });
  }
  // --------------------------------------------------
  // RECHERCHE
  // --------------------------------------------------
  search.addEventListener(
    "input",
    function () {
      const texte =
        search.value
          .toLowerCase()
          .trim();
      const resultats =
        tousLesProfessionnels.filter(
          function (professionnel) {
            const nom =
              String(
                professionnel.nom || ""
              ).toLowerCase();
            const metier =
              String(
                professionnel.Metier || ""
              ).toLowerCase();
            const ville =
              String(
                professionnel.Ville || ""
              ).toLowerCase();
            return (
              nom.includes(texte) ||
              metier.includes(texte) ||
              ville.includes(texte)
            );
          }
        );
      afficherProfessionnels(resultats);
    }
  );
  // --------------------------------------------------
  // PROTECTION DU TEXTE AFFICHÉ
  // --------------------------------------------------
  function escapeHtml(texte) {
    return String(texte)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
  // --------------------------------------------------
  // DÉMARRAGE
  // --------------------------------------------------
  chargerProfessionnels();
</script>
</body>
</html>
