<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KojaJob</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fa;
    }

    .app {
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      background: white;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    .content {
      padding: 20px;
    }

    .search {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: #666;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .call {
      background: #111827;
      color: white;
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    .message {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    .error {
      color: #b91c1c;
      background: #fee2e2;
      padding: 15px;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>KojaJob</h1>
    <p>Trouvez un professionnel près de chez vous</p>
  </header>

  <div class="content">

    <input
      id="search"
      class="search"
      type="text"
      placeholder="Que recherchez-vous ?"
    >

    <div class="title">
      Professionnels disponibles
    </div>

    <div id="professionals">
      <div class="message">
        Connexion...
      </div>
    </div>

  </div>

  <footer>
    © 2026 KojaJob
  </footer>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


  const firebaseConfig = {

    apiKey: "AIzaSyBjIN5du2p3RoQ8Q_X26Zex1JRRMZdhEPA",

    authDomain: "kojajop.firebaseapp.com",

    projectId: "kojajop",

    storageBucket: "kojajop.firebasestorage.app",

    messagingSenderId: "982386680439",

    appId: "1:982386680439:web:ad3098eefc9a7c8d3b9c72",

    measurementId: "G-PPQRGYQMG9"

  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);

  const zone =
    document.getElementById("professionals");

  const search =
    document.getElementById("search");

  let professionnels = [];


  async function charger() {

    try {

      const ref =
        collection(db, "Professionnels");

      const resultat =
        await getDocs(ref);


      zone.innerHTML =
        "<div class='message'>" +
        "Firebase a trouvé " +
        resultat.size +
        " professionnel(s)." +
        "</div>";


      resultat.forEach((doc) => {

        const data = doc.data();

        professionnels.push(data);

      });


      afficher(professionnels);


    } catch (error) {

      zone.innerHTML =
        "<div class='error'>" +
        "<strong>Erreur :</strong><br><br>" +
        error.message +
        "</div>";

    }

  }


  function afficher(liste) {

    if (liste.length === 0) {

      zone.innerHTML =
        "<div class='message'>" +
        "Firebase ne retourne aucun document." +
        "</div>";

      return;

    }


    zone.innerHTML = "";


    liste.forEach((pro) => {

      const nom =
        pro.nom || "Professionnel";

      const metier =
        pro.Metier || "Métier non renseigné";

      const ville =
        pro.Ville || "Ville non renseignée";

      const telephone =
        pro["Téléphone"] || "";


      const card =
        document.createElement("div");

      card.className = "card";


      card.innerHTML = `

        <h3>${nom}</h3>

        <p>🔧 ${metier}</p>

        <p>📍 ${ville}</p>

        ${
          telephone
          ?
          `
          <div class="buttons">

            <a
              class="button call"
              href="tel:+237${telephone}">
              📞 Appeler
            </a>

            <a
              class="button whatsapp"
              href="https://wa.me/237${telephone}"
              target="_blank">
              WhatsApp
            </a>

          </div>
          `
          :
          ""
        }

      `;


      zone.appendChild(card);

    });

  }


  search.addEventListener("input", () => {

    const texte =
      search.value.toLowerCase().trim();


    const resultat =
      professionnels.filter((pro) => {

        return (

          String(pro.nom || "")
            .toLowerCase()
            .includes(texte)

          ||

          String(pro.Metier || "")
            .toLowerCase()
            .includes(texte)

          ||

          String(pro.Ville || "")
            .toLowerCase()
            .includes(texte)

        );

      });


    afficher(resultat);

  });


  charger();

</script>

</body>
</html>
