<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KojaJob</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fa;
    }

    .app {
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      background: white;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    header p {
      margin: 0;
    }

    .content {
      padding: 20px;
    }

    .professional-button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      background: #111827;
      color: white;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .search {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: #666;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .call {
      background: #111827;
      color: white;
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    .message {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>KojaJob</h1>
    <p>Trouvez un professionnel près de chez vous</p>
  </header>

  <div class="content">

    <a
      href="#"
      class="professional-button"
      onclick="alert('La création de profil professionnel sera disponible très bientôt.'); return false;">
      👤 Je suis un professionnel
    </a>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="Que recherchez-vous ?"
    >

    <div class="title">Professionnels disponibles</div>

    <div id="professionals">
      <div class="message">Chargement des professionnels...</div>
    </div>

  </div>

  <footer>
    © 2026 KojaJob
  </footer>

</div>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyBjIN5du2p3RoQ8Q_X26Zex1JRRMZdhEPA",
    authDomain: "kojajop.firebaseapp.com",
    projectId: "kojajop",
    storageBucket: "kojajop.firebasestorage.app",
    messagingSenderId: "982386680439",
    appId: "1:982386680439:web:5fd9da8d9ee1d4243b9c72",
    measurementId: "G-E2NZDGMD4L"
  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);

  const zone =
    document.getElementById("professionals");

  const recherche =
    document.getElementById("search");


  let professionnels = [];


  async function chargerProfessionnels() {

    try {

      const resultat =
        await getDocs(
          collection(db, "Professionnels")
        );
zone.innerHTML = "<div class='message'>Documents reçus : " + resultat.size + "</div>";
      professionnels = [];

      resultat.forEach((document) => {

        professionnels.push({
          id: document.id,
          ...document.data()
        });

      });

      afficher(professionnels);
console.log("Nombre de professionnels :", professionnels.length);
    } catch (erreur) {

      console.error(erreur);

      zone.innerHTML =
        "<div class='message'>" +
        "Erreur Firebase : " +
        erreur.message +
        "</div>";

    }

  }


  function afficher(liste) {

    zone.innerHTML = "";

    if (liste.length === 0) {

      zone.innerHTML =
        "<div class='message'>" +
        "Aucun professionnel trouvé." +
        "</div>";

      return;
    }


    liste.forEach((pro) => {

      const nom =
        pro.nom || "Professionnel";

      const metier =
        pro.Metier || pro.metier || "";

      const ville =
        pro.Ville || pro.ville || "";

      const telephone =
        pro.Téléphone || pro.telephone || "";

      const phone =
        String(telephone).replace(/\s/g, "");


      const carte =
        document.createElement("div");

      carte.className = "card";


      carte.innerHTML = `

        <h3>${nom}</h3>

        <p>🔧 ${metier}</p>

        <p>📍 ${ville}</p>

        <div class="buttons">

          <a
            class="button call"
            href="tel:+237${phone}">
            Appeler
          </a>

          <a
            class="button whatsapp"
            href="https://wa.me/237${phone}"
            target="_blank">
            WhatsApp
          </a>

        </div>

      `;


      zone.appendChild(carte);

    });

  }


  recherche.addEventListener(
    "input",
    function() {

      const texte =
        recherche.value
          .toLowerCase()
          .trim();


      const resultats =
        professionnels.filter((pro) => {

          const nom =
            String(pro.nom || "")
              .toLowerCase();

          const metier =
            String(
              pro.Metier ||
              pro.metier ||
              ""
            ).toLowerCase();

          const ville =
            String(
              pro.Ville ||
              pro.ville ||
              ""
            ).toLowerCase();


          return (
            nom.includes(texte) ||
            metier.includes(texte) ||
            ville.includes(texte)
          );

        });


      afficher(resultats);

    }
  );


  chargerProfessionnels();

</script>

</body>
</html>
